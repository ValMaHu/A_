<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De parte de Evis 💙</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      cursor: pointer; /* Indica que toda la pantalla es interactiva */
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      pointer-events: none; /* Evita conflictos internos de clics en la tarjeta */
    }
    h1 { color: #333; font-size: 1.5rem; margin: 0; }
    p { color: #666; font-size: 1rem; margin: 0; }
    
    .instruction {
      font-size: 0.9rem;
      color: #007bff;
      font-weight: 600;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    
    audio {
      width: 100%;
      margin-top: 10px;
      display: none; /* Se muestra una vez que empiece a sonar */
      pointer-events: auto; /* Permite usar los controles del reproductor */
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Para ti 🎶</h1>
    <p>De parte de Evis 💙</p>
    <p class="instruction" id="instructionText">✨ Toca cualquier parte de la pantalla para comenzar ✨</p>
    
    <!-- Reproductor de audio -->
    <audio id="audioPlayer" controls>
      <source src="audios/Evis.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const instructionText = document.getElementById('instructionText');

    function activarAudio() {
      audio.play().then(() => {
        // Reproducción exitosa: ocultamos el texto de instrucción y mostramos los controles
        instructionText.style.display = 'none';
        audio.style.display = 'block';
        
        // Removemos los eventos para que solo ocurra en el primer toque
        document.removeEventListener('click', activarAudio);
        document.removeEventListener('touchstart', activarAudio);
      }).catch(error => {
        console.log("Esperando interacción del usuario...", error);
      });
    }

    // Escuchamos clics o toques en cualquier parte de la página
    document.addEventListener('click', activarAudio);
    document.addEventListener('touchstart', activarAudio);
  </script>

</body>
</html>
